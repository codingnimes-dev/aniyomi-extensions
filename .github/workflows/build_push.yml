name: Build Nekopoi Extension

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nekoext
      - uses: actions/checkout@v4
        with:
          repository: aniyomiorg/aniyomi-extensions
          ref: master
          path: aniyomi-extensions
      - run: |
          mkdir -p aniyomi-extensions/src/id/nekopoi
          cp -r nekoext/src/id/nekopoi/* aniyomi-extensions/src/id/nekopoi/
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v3
      - working-directory: aniyomi-extensions
        run: |
          cat > settings.gradle.kts << 'EOF'
          apply(from = "repositories.gradle.kts")
          dependencyResolutionManagement {
              versionCatalogs { create("libs") { from(files("gradle/libs.versions.toml")) } }
          }
          include(":core")
          include(":src:id:nekopoi")
          EOF
          ./gradlew :src:id:nekopoi:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aniyomi-id.nekopoi
